<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e4d8b" />
  <title>Her responses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .responses-page {
      position: relative;
      z-index: 1;
      max-width: 430px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2rem;
      min-height: 100dvh;
    }
    .response-item {
      background: rgba(255, 245, 246, 0.92);
      border-radius: 1rem;
      padding: 1rem 1.1rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 4px 14px rgba(92, 18, 25, 0.08);
    }
    .response-item time {
      display: block;
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="hearts-bg" aria-hidden="true">
    <span class="bg-heart">♥</span>
    <span class="bg-heart">♥</span>
    <span class="bg-heart">♥</span>
    <span class="bg-heart">♥</span>
    <span class="bg-heart">♥</span>
    <span class="bg-heart">♥</span>
  </div>
  <div class="responses-page">
    <p class="brand">My Love</p>
    <h1 class="headline">Her responses</h1>
    <p class="support">Newest first — refresh to update.</p>
    <div id="list"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const list = document.getElementById("list");

    async function load() {
      const { data, error } = await client
        .from("forgiveness_responses")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        list.innerHTML = `<p class="support">Could not load: ${error.message}</p>`;
        return;
      }

      if (!data.length) {
        list.innerHTML = `<p class="support">No responses yet.</p>`;
        return;
      }

      list.innerHTML = data
        .map((row) => {
          const when = new Date(row.created_at).toLocaleString();
          const feelings = (row.feelings || []).join(" · ") || "—";
          return `<article class="response-item">
            <time>${when}</time>
            <p><strong>How I made her feel:</strong> ${feelings}</p>
            <p><strong>Regret:</strong> ${row.regret_response || "—"}</p>
            <p><strong>Do better:</strong> ${row.do_better || "—"}</p>
          </article>`;
        })
        .join("");
    }

    load();
  </script>
</body>
</html>
